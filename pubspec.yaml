name: quizzapp
description: Quizapp — Offline LAN Multiplayer Quiz Game for Android
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  sqflite: ^2.3.2
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  nsd: ^5.0.1
  collection: ^1.18.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.2.4
  share_plus: ^7.2.2
  pdf: ^3.11.0
  file_picker: ^8.0.0+1   # Pick .xlsx/.xls files from device
  excel: ^4.0.6            # Parse Excel files in pure Dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Quizapp.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Quizapp.png"
